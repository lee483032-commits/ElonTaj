name: Build Elon Taj Release APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install dependencies and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || (echo 'Missing GitHub secret ANDROID_KEYSTORE_BASE64' && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/elontaj-release.jks"
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$ZIPALIGN" -v -p 4 "$APK" "$RUNNER_TEMP/ElonTaj-aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/elontaj-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out "$RUNNER_TEMP/ElonTaj.apk" "$RUNNER_TEMP/ElonTaj-aligned.apk"
          "$APKSIGNER" verify "$RUNNER_TEMP/ElonTaj.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ElonTaj-Release-APK
          path: ${{ runner.temp }}/ElonTaj.apk
          if-no-files-found: error
          retention-days: 14

